name: Release npm package

on:
  release:
    types:
      - published

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require release commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false

      - name: Install trusted-publishing npm client
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Verify release candidate
        run: npm run verify:release

      - name: Match release tag to package version
        run: npm run check:package -- --tag "$GITHUB_REF_NAME"

      - name: Publish with trusted publishing
        run: npm publish --access public
